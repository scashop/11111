<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录与注册模板</title>
    <style>
        :root {
            --primary: #3f51b5;
            --primary-dark: #2c3e9c;
            --bg: #f4f6fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #dbe2f0;
            --success: #0f9d58;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
            background: linear-gradient(160deg, #eef2ff 0%, #f8fbff 100%);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .panel {
            width: 100%;
            max-width: 460px;
            background: var(--card);
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 12px 35px rgba(27, 39, 94, 0.12);
            overflow: hidden;
        }

        .panel-header {
            padding: 24px 24px 12px;
            text-align: center;
        }

        .panel-header h1 {
            margin: 0;
            font-size: 24px;
        }

        .panel-header p {
            margin: 10px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        .tabs {
            display: flex;
            margin: 0 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        .tab-btn {
            flex: 1;
            border: none;
            background: #f8f9fc;
            color: var(--muted);
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #fff;
        }

        .form-wrap {
            padding: 20px 24px 26px;
        }

        .form {
            display: none;
        }

        .form.active {
            display: block;
        }

        .field {
            margin-bottom: 14px;
        }

        .field label {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .field input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .field input:focus {
            border-color: var(--primary);
        }

        .inline-group {
            display: flex;
            gap: 8px;
        }

        .inline-group input {
            flex: 1;
        }

        .small-btn {
            white-space: nowrap;
            border: 1px solid var(--primary);
            color: var(--primary);
            background: #fff;
            border-radius: 8px;
            padding: 0 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .links {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 14px;
        }

        .link-btn {
            border: none;
            background: none;
            color: var(--primary);
            padding: 0;
            font-size: 13px;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            border: none;
            background: var(--primary);
            color: #fff;
            border-radius: 10px;
            padding: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: var(--primary-dark);
        }

        .tip {
            margin-top: 12px;
            font-size: 13px;
            color: var(--muted);
        }

        .message {
            min-height: 22px;
            margin-top: 12px;
            font-size: 13px;
        }

        .message.success {
            color: var(--success);
        }

        .message.warn {
            color: var(--warning);
        }

        .success-screen {
            display: none;
            padding: 40px 24px;
            text-align: center;
        }

        .success-screen.show {
            display: block;
        }

        .success-screen h2 {
            margin: 0;
            font-size: 30px;
            color: var(--success);
        }

        .success-screen p {
            margin-top: 12px;
            color: var(--muted);
        }
    </style>
</head>
<body>
<main class="panel">
    <section id="auth-panel">
        <div class="panel-header">
            <h1>用户系统模板</h1>
            <p>包含登录、忘记密码、邮箱验证码注册流程</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" type="button" data-tab="login">登录</button>
            <button class="tab-btn" type="button" data-tab="register">注册</button>
        </div>

        <div class="form-wrap">
            <form id="login-form" class="form active">
                <div class="field">
                    <label for="login-username">用户名</label>
                    <input id="login-username" type="text" placeholder="请输入用户名" required>
                </div>
                <div class="field">
                    <label for="login-password">密码</label>
                    <input id="login-password" type="password" placeholder="请输入密码" required minlength="6">
                </div>
                <div class="links">
                    <button class="link-btn" id="forgot-btn" type="button">忘记密码？</button>
                </div>
                <button class="submit-btn" type="submit">登录</button>
                <div class="tip">演示模板：默认只做前端基础校验与流程展示。</div>
                <div id="login-message" class="message"></div>
            </form>

            <form id="register-form" class="form">
                <div class="field">
                    <label for="register-username">用户名</label>
                    <input id="register-username" type="text" placeholder="请输入用户名" required>
                </div>
                <div class="field">
                    <label for="register-email">邮箱</label>
                    <input id="register-email" type="email" placeholder="请输入邮箱" required>
                </div>
                <div class="field">
                    <label for="register-code">邮箱验证码</label>
                    <div class="inline-group">
                        <input id="register-code" type="text" placeholder="请输入6位验证码" maxlength="6" required>
                        <button class="small-btn" id="code-btn" type="button">获取验证码</button>
                    </div>
                </div>
                <div class="field">
                    <label for="register-password">密码</label>
                    <input id="register-password" type="password" placeholder="请输入密码（至少6位）" minlength="6" required>
                </div>
                <button class="submit-btn" type="submit">注册并登录</button>
                <div class="tip">演示验证码固定为：123456</div>
                <div id="register-message" class="message"></div>
            </form>
        </div>
    </section>

    <section id="success-screen" class="success-screen">
        <h2>请开始你的操作</h2>
        <p>登录/注册成功，已进入下一页面。</p>
    </section>
</main>

<script>
    const tabs = document.querySelectorAll(".tab-btn");
    const loginForm = document.getElementById("login-form");
    const registerForm = document.getElementById("register-form");
    const loginMessage = document.getElementById("login-message");
    const registerMessage = document.getElementById("register-message");
    const forgotBtn = document.getElementById("forgot-btn");
    const codeBtn = document.getElementById("code-btn");
    const authPanel = document.getElementById("auth-panel");
    const successScreen = document.getElementById("success-screen");
    const DEMO_CODE = "123456";

    function switchTab(target) {
        tabs.forEach((tab) => {
            tab.classList.toggle("active", tab.dataset.tab === target);
        });
        loginForm.classList.toggle("active", target === "login");
        registerForm.classList.toggle("active", target === "register");
        loginMessage.textContent = "";
        registerMessage.textContent = "";
        loginMessage.className = "message";
        registerMessage.className = "message";
    }

    function showSuccess() {
        authPanel.style.display = "none";
        successScreen.classList.add("show");
    }

    tabs.forEach((tab) => {
        tab.addEventListener("click", () => switchTab(tab.dataset.tab));
    });

    forgotBtn.addEventListener("click", () => {
        loginMessage.textContent = "请通过邮箱验证码或客服联系重置密码。";
        loginMessage.className = "message warn";
    });

    codeBtn.addEventListener("click", () => {
        const email = document.getElementById("register-email").value.trim();
        if (!email) {
            registerMessage.textContent = "请先输入邮箱，再获取验证码。";
            registerMessage.className = "message warn";
            return;
        }
        registerMessage.textContent = "验证码已发送（演示码：123456）。";
        registerMessage.className = "message success";
    });

    loginForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const username = document.getElementById("login-username").value.trim();
        const password = document.getElementById("login-password").value;

        if (!username || !password) {
            loginMessage.textContent = "请输入用户名和密码。";
            loginMessage.className = "message warn";
            return;
        }
        if (password.length < 6) {
            loginMessage.textContent = "密码长度不能少于 6 位。";
            loginMessage.className = "message warn";
            return;
        }

        loginMessage.textContent = "登录成功，正在跳转...";
        loginMessage.className = "message success";
        setTimeout(showSuccess, 600);
    });

    registerForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const username = document.getElementById("register-username").value.trim();
        const code = document.getElementById("register-code").value.trim();
        const password = document.getElementById("register-password").value;

        if (!username) {
            registerMessage.textContent = "请输入用户名。";
            registerMessage.className = "message warn";
            return;
        }
        if (code !== DEMO_CODE) {
            registerMessage.textContent = "验证码错误，请输入 123456（演示）。";
            registerMessage.className = "message warn";
            return;
        }
        if (password.length < 6) {
            registerMessage.textContent = "密码长度不能少于 6 位。";
            registerMessage.className = "message warn";
            return;
        }

        registerMessage.textContent = "注册成功，正在跳转...";
        registerMessage.className = "message success";
        setTimeout(showSuccess, 600);
    });
</script>
</body>
</html>
